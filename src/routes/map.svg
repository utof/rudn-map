<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Black background -->
  <rect width="100%" height="100%" fill="#000"/>
  <!-- Room 1 (top left) -->
  <polygon fill="#fff" stroke="none" points="80,60 260,40 240,180 60,160"/>
  <!-- Room 2 (top right) -->
  <polygon fill="#fff" stroke="none" points="340,60 540,80 520,190 320,170"/>
  <!-- Room 3 (bottom left) -->
  <polygon fill="#fff" stroke="none" points="90,250 250,240 230,360 70,340"/>
  <!-- Room 4 (bottom right) -->
  <polygon fill="#fff" stroke="none" points="320,250 520,260 500,370 300,350"/>
  <!-- Central corridor (horizontal) -->
  <rect x="120" y="180" width="360" height="40" fill="#fff"/>
  <!-- West corridor (vertical, connects Room 1 and Room 3 to central) -->
  <rect x="90" y="120" width="40" height="160" fill="#fff"/>
  <!-- East corridor (vertical, connects Room 2 and Room 4 to central) -->
  <rect x="470" y="120" width="40" height="160" fill="#fff"/>
  <!-- Diagonal connectors for more complexity -->
  <polygon fill="#fff" stroke="none" points="120,180 160,180 120,220 80,220"/>
  <polygon fill="#fff" stroke="none" points="480,180 520,180 520,220 480,220"/>
</svg>